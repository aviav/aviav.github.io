pdf-engine: xelatex
from: markdown-smart
toc: true
toc-depth: 2
variables:
  mainfont: "Noto Sans CJK SC"
  sansfont: "Noto Sans CJK SC"
  monofont: "Noto Sans Mono CJK SC"
  geometry: margin=1in
  documentclass: report
  toc-title: "Contents"
  header-includes: |
    \usepackage{fontspec}
    \usepackage{ucharclasses}
    \newfontfamily\hebrewfont{Noto Serif Hebrew}
    \newfontfamily\arabicfont{Noto Sans Arabic}
    \newfontfamily\devanagarifont{Noto Serif Devanagari}
    \newfontfamily\kannadafont{Noto Serif Kannada}
    \newfontfamily\malayalamfont{Noto Serif Malayalam}
    \newfontfamily\greekfont{Noto Serif}
    \newfontfamily\ipafont{Noto Sans}
    \newfontfamily\cyrillicfont{Noto Serif}
    \newfontfamily\latinfont{Noto Serif}
    \setTransitionsFor{Hebrew}{\hebrewfont}{\normalfont}
    \setTransitionsForArabics{\arabicfont}{\normalfont}
    \setTransitionsForDevanagari{\devanagarifont}{\normalfont}
    \setTransitionsFor{Kannada}{\kannadafont}{\normalfont}
    \setTransitionsFor{Malayalam}{\malayalamfont}{\normalfont}
    \setTransitionsFor{Greek}{\greekfont}{\normalfont}
    \setTransitionsFor{GreekExtended}{\greekfont}{\normalfont}
    \setTransitionsFor{Cyrillic}{\cyrillicfont}{\normalfont}
    \setTransitionsFor{CyrillicExtendedA}{\cyrillicfont}{\normalfont}
    \setTransitionsFor{CyrillicExtendedB}{\cyrillicfont}{\normalfont}
    \setTransitionsFor{IPAExtensions}{\ipafont}{\normalfont}
    \setTransitionsFor{SpacingModifierLetters}{\ipafont}{\normalfont}
    \setTransitionsFor{LatinExtendedAdditional}{\latinfont}{\normalfont}
